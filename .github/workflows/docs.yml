name: Auto Docs

on:
  push:
    branches: [ "main" ] 

permissions:
  contents: write

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Generate Documentation
      run: go doc -all > docs.txt

    - name: Commit and Push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add docs.txt
        # Если изменений нет, скрипт не упадет благодаря || echo...
        git commit -m "docs: Автоматическая генерация документации" || echo "Нет изменений"
        git push